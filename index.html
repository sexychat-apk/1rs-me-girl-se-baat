<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .download-btn {
      padding: 14px 32px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s;
    }

    .download-btn:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <a class="download-btn" href="YOUR_APP_LINK_HERE" download>
    Download App
  </a>

</body>
</html>
