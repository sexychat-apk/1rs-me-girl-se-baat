    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #ec4899 0%, transparent 35%),
        linear-gradient(135deg, #111827, #312e81);
      display: flex;

    .card {

      padding: 45px 30px;
      border-radius: 28px;

      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .app-icon {
      width: 95px;
      height: 95px;
      margin: 0 auto 22px;

      border-radius: 24px;
      background: linear-gradient(135deg, #ffffff, #e0e7ff);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;
      color: #4f46e5;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);

    h1 {

      margin-bottom: 12px;

    }

    .description {
      color: rgba(255, 255, 255, 0.78);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      padding: 17px 20px;

      border-radius: 14px;
      background: white;
      color: #312e81;

      text-decoration: none;
      font-size: 17px;
      font-weight: 700;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

      transition: all 0.25s ease;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    .download-btn:active {
      transform: scale(0.98);
    }

    .download-icon {
      font-size: 22px;
    }

    .info {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
    }

    @media (max-width: 480px) {
      .card {
        padding: 38px 22px;
      }

      h1 {
